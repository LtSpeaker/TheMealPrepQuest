<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="30%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#26332a"/>
      <stop offset="100%" stop-color="#182019"/>
    </radialGradient>
    <filter id="depthShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080b08" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Hintergrund: abgerundet für Favicon/Browser-Anzeige (kein OS-Masking wie bei Homescreen-Icons) -->
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Layer 1 (hinten): Q -->
  <g filter="url(#depthShadow)" transform="translate(364,208) rotate(-7)">
    <rect x="-90" y="-90" width="180" height="180" rx="30" fill="#e07a52"/>
    <text x="0" y="7" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
          font-size="122" fill="#2a1509" stroke="#2a1509" stroke-width="2.5">Q</text>
  </g>

  <!-- Layer 2 (mitte): P -->
  <g filter="url(#depthShadow)" transform="translate(258,256) rotate(4)">
    <rect x="-90" y="-90" width="180" height="180" rx="30" fill="#e8b23d"/>
    <text x="0" y="7" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
          font-size="122" fill="#2a2005" stroke="#2a2005" stroke-width="2.5">P</text>
  </g>

  <!-- Layer 3 (vorne): M -->
  <g filter="url(#depthShadow)" transform="translate(152,304) rotate(-3)">
    <rect x="-90" y="-90" width="180" height="180" rx="30" fill="#f2ede1"/>
    <text x="0" y="7" text-anchor="middle" dominant-baseline="central"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
          font-size="122" fill="#232019" stroke="#232019" stroke-width="2.5">M</text>
  </g>
</svg>
