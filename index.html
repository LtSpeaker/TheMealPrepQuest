<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TheMealPrepQuest</title>
<meta name="description" content="Finde Rezept-Inspiration für dein Meal Prep – nach Kategorie, Zeit, Tagen und Personenzahl.">

<!-- Theme so früh wie möglich setzen, damit es beim Laden nicht kurz aufblitzt -->
<script>
(function(){
  try {
    var raw = localStorage.getItem('mpq_state_v1');
    var theme = raw ? JSON.parse(raw).theme : null;
    if (theme !== 'light' && theme !== 'dark') {
      theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>

<!-- PWA / Homescreen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" id="theme-color-meta" content="#F7F5EF">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<!-- iOS Homescreen-Verhalten -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TheMealPrepQuest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F7F5EF; --bg-elevated:#FFFFFF; --surface-muted:#ECE7DB;
    --text:#1C2430; --text-secondary:rgba(28,36,48,.62); --text-tertiary:rgba(28,36,48,.38);
    --border:rgba(28,36,48,.13); --accent:#1565C0; --accent-soft:rgba(21,101,192,.10); --accent-contrast:#FFFFFF;
    --font-display:'Fredoka',sans-serif; --font-body:'Plus Jakarta Sans',sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#10131A; --bg-elevated:#181D26; --surface-muted:#232A35;
    --text:#F2F4F7; --text-secondary:rgba(242,244,247,.64); --text-tertiary:rgba(242,244,247,.38);
    --border:rgba(242,244,247,.13); --accent:#5B9DF9; --accent-soft:rgba(91,157,249,.16); --accent-contrast:#0B1220;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  button{ font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  button:disabled{ cursor: not-allowed; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  .app{ max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---------- HEADER ---------- */
  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .masthead .brand{ font-family: var(--font-display); font-weight:700; font-size:24px; letter-spacing:-0.01em; }
  .masthead .brand span{ color: var(--accent); }
  .masthead .tagline{ font-size:13px; color: var(--text-secondary); margin-top:2px; }
  .theme-toggle{
    width:38px; height:38px; border-radius:999px; border:1px solid var(--border);
    background: var(--bg-elevated); color: var(--text);
    display:flex; align-items:center; justify-content:center;
  }

  .nav-row{ display:flex; align-items:center; gap:10px; margin-bottom:26px; flex-wrap:wrap; }
  .round-badge{
    font-family: var(--font-display); font-weight:600; font-size:12px; color: var(--accent);
    background: var(--accent-soft); border-radius:999px; padding:7px 14px;
  }
  .nav-pill{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border);
    background: var(--bg-elevated); color: var(--text); padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:500;
  }
  .nav-pill b{ font-family: var(--font-display); font-weight:600; color: var(--accent); }

  /* ---------- VIEWS ---------- */
  .view{ display:none; }
  .view.active{ display:block; animation: fadeUp .5s ease both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- FORM ---------- */
  .form-progress{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .form-progress-track{ flex:1; height:6px; border-radius:3px; background: var(--surface-muted); overflow:hidden; }
  .form-progress-fill{ height:100%; background: var(--accent); border-radius:3px; transition:width .3s ease; }
  .form-progress-label{ font-size:12px; color: var(--text-secondary); white-space:nowrap; }

  .form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(340px,1fr)); gap:22px; align-items:start; }
  .summary-card{ background: var(--bg-elevated); border:1px solid var(--border); border-radius:20px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .summary-card h4{ font-family: var(--font-display); font-weight:600; font-size:14px; margin:0 0 8px; }
  .summary-card p{ font-size:13.5px; color: var(--text-secondary); line-height:1.6; margin:0; }

  .form-card{ background: var(--bg-elevated); border:1px solid var(--border); border-radius:24px; padding:30px 26px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .form-card h2{ font-family: var(--font-display); font-weight:600; font-size:26px; line-height:1.15; margin:0 0 6px; }
  .form-card .lede{ font-size:13.5px; color: var(--text-secondary); margin-bottom:26px; max-width:44ch; }

  .field-group{ display:flex; flex-direction:column; gap:26px; }
  .field-label-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .field-num{
    width:22px; height:22px; border-radius:999px; background: var(--accent-soft); color: var(--accent);
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .field-num.optional{ background: var(--surface-muted); color: var(--text-secondary); }
  .field-label-row .label{ font-size:13.5px; font-weight:600; }
  .field-label-row .hint{ font-size:11.5px; color: var(--text-tertiary); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-cat{ display:flex; align-items:center; gap:7px; border:1.5px solid var(--border); padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:500; }
  .chip-time{ border:1.5px solid var(--border); padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:500; }
  .chip-filter{ border:1.5px solid var(--border); padding:7px 13px; border-radius:8px; font-size:12.5px; font-weight:500; }

  .stepper-row{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:20px; }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepper button{ width:34px; height:34px; border-radius:999px; border:1.5px solid var(--border); background: var(--bg-elevated); color: var(--text); font-size:17px; font-weight:600; }
  .stepper .val{ font-family: var(--font-display); font-weight:600; font-size:19px; min-width:26px; text-align:center; }
  .stepper .unit{ font-size:12.5px; color: var(--text-secondary); }

  .form-footer{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; border-top:1px dashed var(--border); padding-top:22px; margin-top:28px; }
  .form-footer .hint{ font-size:12.5px; color: var(--text-secondary); }
  .btn-cta{ border:none; padding:13px 24px; border-radius:999px; font-weight:600; font-size:14.5px; }

  /* ---------- RESULTS ---------- */
  .back-link{ background:none; border:none; color: var(--text-secondary); font-size:12.5px; display:flex; align-items:center; gap:6px; padding:0; margin-bottom:14px; }
  .back-link:hover{ color: var(--accent); }
  .view-title{ font-family: var(--font-display); font-weight:600; font-size:26px; margin:0 0 6px; }

  .results-head{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:18px; }
  .combo-text{ font-size:13px; color: var(--text-secondary); margin-bottom:8px; }
  .portions-line{ font-size:12.5px; color: var(--text-secondary); }
  .portions-line b{ color: var(--accent); font-family: var(--font-display); }
  .portions-track{ width:220px; height:6px; border-radius:3px; background: var(--surface-muted); overflow:hidden; margin-top:6px; }
  .portions-fill{ height:100%; background: var(--accent); border-radius:3px; transition:width .3s ease; }
  .btn-ghost{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); background: var(--bg-elevated); color: var(--text); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; }

  .recipe-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .recipe-card{ background: var(--bg-elevated); border:1px solid var(--border); border-radius:20px; padding:20px; display:flex; flex-direction:column; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .recipe-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .recipe-cat{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .recipe-time{ font-size:11.5px; color: var(--text-tertiary); }
  .recipe-title{ font-family: var(--font-display); font-weight:600; font-size:17px; line-height:1.25; margin:0 0 10px; }
  .recipe-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tag-badge{ font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:6px; }
  .expand-btn{ background:none; border:none; color: var(--accent); font-size:12.5px; font-weight:600; padding:0; text-align:left; margin-bottom:10px; }
  .recipe-detail{ margin-bottom:12px; }
  .recipe-detail h5{ font-size:11px; font-weight:600; color: var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px; }
  .recipe-detail ul{ margin:0 0 12px; padding-left:18px; font-size:13px; line-height:1.6; color: var(--text); }
  .recipe-detail ol{ margin:0; padding-left:18px; font-size:13px; line-height:1.6; color: var(--text-secondary); }
  .recipe-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px dashed var(--border); padding-top:12px; margin-top:4px; }
  .freezer-note{ display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-tertiary); }
  .batch-ctl{ display:flex; align-items:center; gap:10px; }
  .batch-ctl button.minus{ width:26px; height:26px; border-radius:999px; border:1.5px solid var(--border); background: var(--bg-elevated); color: var(--text); font-size:14px; font-weight:600; }
  .batch-ctl button.plus{ width:26px; height:26px; border-radius:999px; border:none; background: var(--accent); color: var(--accent-contrast); font-size:14px; font-weight:700; }
  .batch-count{ font-family: var(--font-display); font-weight:600; font-size:14px; min-width:14px; text-align:center; }

  .empty-state{ text-align:center; padding:60px 20px; background: var(--bg-elevated); border:1px solid var(--border); border-radius:20px; }
  .empty-state h3{ font-family: var(--font-display); font-weight:600; font-size:20px; margin:0 0 8px; }
  .empty-state p{ font-size:13.5px; color: var(--text-secondary); margin:0; }

  /* ---------- SHOPPING / COOKLIST SHARED ---------- */
  .sub-subtitle{ font-size:13px; color: var(--text-secondary); margin-bottom:22px; }

  .shopping-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap:20px; margin-bottom:24px; }
  .shopping-panel{ background: var(--bg-elevated); border:1px solid var(--border); border-radius:18px; padding:18px; }
  .shopping-panel h5{ font-size:11px; font-weight:600; color: var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin:0 0 10px; }
  .shopping-item{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px dotted var(--border); }
  .shopping-item .amt{ color: var(--accent); font-weight:600; white-space:nowrap; }
  .shopping-recipe-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; padding:7px 0; border-bottom:1px dotted var(--border); }
  .shopping-recipe-item .dot{ width:8px; height:8px; border-radius:999px; flex:none; }
  .shopping-recipe-item .batch-pill{ font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; font-size:12px; }
  .shopping-actions{ display:flex; flex-wrap:wrap; gap:10px; }
  .btn-accent{ background: var(--accent); color: var(--accent-contrast); border:none; padding:11px 18px; border-radius:999px; font-weight:600; font-size:13.5px; }
  .btn-outline{ background:none; border:1px solid var(--border); color: var(--text); padding:11px 18px; border-radius:999px; font-weight:500; font-size:13.5px; }
  .btn-outline.muted{ color: var(--text-secondary); }

  .cooklist-list{ display:flex; flex-direction:column; gap:18px; }
  .cooklist-item{ background: var(--bg-elevated); border:1px solid var(--border); border-top:3px solid; border-radius:20px; padding:22px; }
  .cooklist-item-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:1px dashed var(--border); padding-bottom:12px; margin-bottom:14px; }
  .cooklist-item-head .cat{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .cooklist-item-head h3{ font-family: var(--font-display); font-weight:600; font-size:18px; margin:0; }
  .cooklist-batches{ font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px; white-space:nowrap; }
  .cooklist-cols{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:18px; }
  .cooklist-cols h5{ font-size:11px; font-weight:600; color: var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; }
  .cooklist-cols ul{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; }
  .cooklist-steps{ display:flex; flex-direction:column; gap:9px; }
  .cooklist-step{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; cursor:pointer; color: var(--text); }
  .cooklist-step input{ margin-top:3px; accent-color: var(--accent); flex-shrink:0; }
  .cooklist-step.checked{ text-decoration:line-through; color: var(--text-tertiary); }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background: var(--text); color: var(--bg); padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:500; box-shadow:0 10px 24px rgba(0,0,0,.2); z-index:100;
  }
</style>
</head>
<body>

<div class="app">

  <header class="masthead">
    <div>
      <div class="brand">The<span>MealPrep</span>Quest</div>
      <div class="tagline">Inspiration statt Grübeln</div>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Farbmodus wechseln" data-action="toggle-theme">
      <span id="theme-icon"></span>
    </button>
  </header>

  <div class="nav-row">
    <div class="round-badge">Runde #<span id="round-no"></span></div>
    <div style="flex:1"></div>
    <button type="button" class="nav-pill" id="nav-shopping" data-action="go-shopping">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h2l1.5 11h11L20 8H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.2" fill="currentColor"/><circle cx="17" cy="20" r="1.2" fill="currentColor"/></svg>
      Einkauf <b id="nav-shopping-count">0</b>
    </button>
    <button type="button" class="nav-pill" id="nav-cooklist" data-action="go-cooklist" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 3v6M9 3v6M6 9c0 2-1 3-1 6v6h4v-6c0-3-1-4-1-6M15 3c-2 0-3 2-3 5s1 4 3 4v9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Kochliste <b id="nav-cooklist-count">0</b>
    </button>
  </div>

  <section id="view-form" class="view active"></section>
  <section id="view-results" class="view"></section>
  <section id="view-shopping" class="view"></section>
  <section id="view-cooklist" class="view"></section>

</div>

<div id="toast" class="toast" style="display:none"></div>

<script type="module">
"use strict";
import { RECIPES } from "./recipes-data.js";

const CAT_DEFS = [
  { id:"fleisch", label:"Fleisch", colorL:"#C0442B", colorD:"#E8735A", icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M14 3c3 0 6 2.5 6 6.5 0 3-2 5-4.5 6.3L9 22l-3-3 6.2-6.5C10.9 11.2 9 8.9 9 6.5 9 4.6 11.3 3 14 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
  { id:"fisch", label:"Fisch", colorL:"#1B7F93", colorD:"#3FB4CB", icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12c3-4 8-6 12-4l4-2-1 4 1 4-4-2c-4 2-9 0-12-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8.5" cy="10.5" r="0.8" fill="currentColor"/></svg>' },
  { id:"vegetarisch", label:"Vegetarisch", colorL:"#4E7A2E", colorD:"#82C158", icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 21c-5-1-8-5-8-10 4 0 7 1 9 3 1-4 4-6 8-6 0 6-4 10-9 11z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
  { id:"vegan", label:"Vegan", colorL:"#2F8F5B", colorD:"#4FCB89", icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 21V10M12 10c0-4-3-7-7-7 0 4 3 7 7 7zm0 0c0-3.5 2.5-6 6-6-0.2 3.5-2.6 6-6 6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>' },
];
const TIME_DEFS = [ { id:"30", label:"bis 30 Min" }, { id:"60", label:"bis 60 Min" }, { id:"90", label:"90+ Min" } ];
const FILTER_DEFS = [
  { id:"lowcarb", label:"Low Carb", colorL:"#8E5FC7", colorD:"#B08AE0" },
  { id:"protein", label:"High Protein", colorL:"#4E7A2E", colorD:"#82C158" },
  { id:"kalorienarm", label:"Kalorienarm", colorL:"#1B7F93", colorD:"#3FB4CB" },
  { id:"schnell", label:"Schnell", colorL:"#C68A1C", colorD:"#E8B23D" },
];
const CAT_MAP = Object.fromEntries(CAT_DEFS.map(d => [d.id, d]));
const FILTER_MAP = Object.fromEntries(FILTER_DEFS.map(d => [d.id, d]));

const STORE_KEY = "mpq_state_v1";
const OLD_STORE_KEY = "mealprepquest:plan"; // Speicherformat vor dem Redesign
const MAX_RESULTS = 6;

const SUN_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const MOON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
const SHUFFLE_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M4 4l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SNOWFLAKE_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function timeMax(bucket){ return bucket === "30" ? 30 : bucket === "60" ? 60 : Infinity; }
function fmtAmount(n){ const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : String(r).replace(".", ","); }
function sample(arr, n){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); }
function isSafari(){ const ua = navigator.userAgent; return /^((?!chrome|crios|fxios|android).)*safari/i.test(ua); }
function softAlpha(hex, theme){ return theme === "light" ? hex + "1a" : hex + "29"; }
function catColor(catId, theme){ const d = CAT_MAP[catId]; return theme === "light" ? d.colorL : d.colorD; }
function filterColor(filterId, theme){ const d = FILTER_MAP[filterId]; return theme === "light" ? d.colorL : d.colorD; }

const state = {
  theme: "light", view: "form",
  selCats: [], selTime: null, days: 5, persons: 2, selFilters: [],
  resultIds: [], expanded: {}, plan: {}, checkedSteps: {},
  questNo: 100 + Math.floor(Math.random() * 800),
};

function loadPersisted(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved.theme === "light" || saved.theme === "dark") state.theme = saved.theme;
      if (saved.plan && typeof saved.plan === "object") state.plan = saved.plan;
      if (saved.checkedSteps && typeof saved.checkedSteps === "object") state.checkedSteps = saved.checkedSteps;
      if (typeof saved.persons === "number" && saved.persons >= 1 && saved.persons <= 8) state.persons = saved.persons;
    } else {
      // Einmalige Migration aus der Speicherung von vor dem Redesign.
      const oldRaw = localStorage.getItem(OLD_STORE_KEY);
      if (oldRaw) {
        const old = JSON.parse(oldRaw);
        if (old.plan && typeof old.plan === "object") state.plan = old.plan;
        if (typeof old.persons === "number") state.persons = old.persons;
      }
    }
  } catch (e) { /* korrupte/fremde Daten ignorieren */ }
  if (state.theme !== "light" && state.theme !== "dark") {
    state.theme = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  // Verwaiste Einträge (Rezept existiert nicht mehr) entfernen.
  const cleaned = {};
  Object.keys(state.plan).forEach(id => {
    if (RECIPES.some(r => r.id === id) && state.plan[id] > 0) cleaned[id] = state.plan[id];
  });
  state.plan = cleaned;
}

function persist(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      plan: state.plan, checkedSteps: state.checkedSteps, theme: state.theme, persons: state.persons,
    }));
  } catch (e) { /* z.B. privater Browser-Modus ohne localStorage-Zugriff */ }
}

function getPlannedList(){
  return Object.entries(state.plan)
    .filter(([, n]) => n > 0)
    .map(([id, n]) => ({ recipe: RECIPES.find(r => r.id === id), batches: n }))
    .filter(x => x.recipe);
}

function buildAggregate(){
  const persons = state.persons;
  const map = {};
  getPlannedList().forEach(({ recipe, batches }) => {
    recipe.ingredients.forEach(ing => {
      const key = ing.name + "|" + ing.unit;
      if (!map[key]) map[key] = { name: ing.name, unit: ing.unit, total: 0 };
      map[key].total += ing.amount * persons * batches;
    });
  });
  return Object.values(map).sort((a, b) => a.name.localeCompare(b.name, "de"));
}

function getFilteredPool(){
  return RECIPES.filter(r =>
    state.selCats.includes(r.category) &&
    r.time <= timeMax(state.selTime) &&
    state.selFilters.every(f => r.tags.includes(f))
  );
}

// ---------------- ACTIONS ----------------
function toggleTheme(){ state.theme = state.theme === "light" ? "dark" : "light"; persist(); render(); }
function toggleCat(id){ state.selCats = state.selCats.includes(id) ? state.selCats.filter(x => x !== id) : [...state.selCats, id]; render(); }
function selectTime(id){ state.selTime = id; render(); }
function toggleFilter(id){ state.selFilters = state.selFilters.includes(id) ? state.selFilters.filter(x => x !== id) : [...state.selFilters, id]; render(); }
function adjustDays(delta){ state.days = Math.max(1, Math.min(14, state.days + delta)); render(); }
function adjustPersons(delta){ state.persons = Math.max(1, Math.min(8, state.persons + delta)); persist(); render(); }
function toggleExpand(id){ state.expanded[id] = !state.expanded[id]; render(); }
function goForm(){ state.view = "form"; render(); }
function goResults(){ state.resultIds = sample(getFilteredPool(), MAX_RESULTS).map(r => r.id); state.view = "results"; render(); }
function shuffle(){ state.resultIds = sample(getFilteredPool(), MAX_RESULTS).map(r => r.id); render(); }
function goShopping(){ state.view = "shopping"; render(); }
function goCooklist(){ state.view = "cooklist"; render(); }
function goBackFromSub(){ state.view = state.resultIds.length ? "results" : "form"; render(); }
function adjustPlan(id, delta){
  const cur = state.plan[id] || 0;
  const next = Math.max(0, cur + delta);
  if (next === 0) delete state.plan[id]; else state.plan[id] = next;
  persist(); render();
}
function toggleStep(key){ state.checkedSteps[key] = !state.checkedSteps[key]; persist(); render(); }
function clearPlan(){
  if (!window.confirm("Wochenplan wirklich leeren?")) return;
  state.plan = {}; state.checkedSteps = {};
  persist(); render();
}

let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = "none"; }, 2200);
}

function icsEscape(text){ return String(text).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,"); }

function exportReminders(){
  const ing = buildAggregate();
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TheMealPrepQuest//DE"];
  ing.forEach((it, i) => {
    lines.push(
      "BEGIN:VTODO",
      "UID:mpq-" + Date.now() + "-" + i + "@themealprepquest",
      "SUMMARY:" + icsEscape(fmtAmount(it.total) + " " + it.unit + " " + it.name),
      "STATUS:NEEDS-ACTION",
      "END:VTODO"
    );
  });
  lines.push("END:VCALENDAR");
  const ics = lines.join("\r\n");
  if (isSafari()) {
    // Safari (iOS & macOS) kann Blob-Downloads von .ics oft nicht öffnen –
    // stattdessen direkt zur data-URI navigieren, damit Safari den
    // text/calendar-Inhalt selbst erkennt und den Import anbietet.
    window.location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    return;
  }
  try {
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "einkaufsliste.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast("Als Erinnerungen-Datei exportiert.");
  } catch (e) { showToast("Export nicht möglich."); }
}

function copyFallback(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); showToast("Liste kopiert."); }
  catch (e) { showToast("Kopieren nicht möglich."); }
  document.body.removeChild(ta);
}
function copyList(){
  const ing = buildAggregate();
  const text = ing.map(it => "• " + fmtAmount(it.total) + " " + it.unit + " " + it.name).join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast("Liste kopiert.")).catch(() => copyFallback(text));
  } else {
    copyFallback(text);
  }
}

// ---------------- RENDER ----------------
const themeIcon = document.getElementById("theme-icon");
const themeColorMeta = document.getElementById("theme-color-meta");
const roundNoEl = document.getElementById("round-no");
const navShopping = document.getElementById("nav-shopping");
const navShoppingCount = document.getElementById("nav-shopping-count");
const navCooklist = document.getElementById("nav-cooklist");
const navCooklistCount = document.getElementById("nav-cooklist-count");
const viewForm = document.getElementById("view-form");
const viewResults = document.getElementById("view-results");
const viewShopping = document.getElementById("view-shopping");
const viewCooklist = document.getElementById("view-cooklist");
const toastEl = document.getElementById("toast");

function renderHeader(){
  themeIcon.innerHTML = state.theme === "light" ? SUN_SVG : MOON_SVG;
  roundNoEl.textContent = state.questNo;
  const plannedList = getPlannedList();
  const totalPortions = plannedList.reduce((a, { batches }) => a + batches * state.persons, 0);
  navShoppingCount.textContent = totalPortions;
  navCooklistCount.textContent = plannedList.length;
  navCooklist.style.display = plannedList.length > 0 ? "flex" : "none";
}

function renderForm(){
  const t = state.theme;
  const filled = (state.selCats.length > 0 ? 1 : 0) + (state.selTime ? 1 : 0) + 2;
  const pct = Math.round((filled / 4) * 100);

  const catChips = CAT_DEFS.map(d => {
    const active = state.selCats.includes(d.id);
    const cc = catColor(d.id, t);
    const fg = active ? (t === "light" ? "#FFFFFF" : "#0B1220") : "var(--text)";
    return `<button type="button" class="chip-cat" data-action="toggle-cat" data-id="${d.id}"
      style="background:${active ? cc : "transparent"};border-color:${active ? cc : "var(--border)"};color:${fg}">
      <span>${d.icon}</span>${d.label}</button>`;
  }).join("");

  const timeChips = TIME_DEFS.map(d => {
    const active = state.selTime === d.id;
    return `<button type="button" class="chip-time" data-action="select-time" data-id="${d.id}"
      style="background:${active ? "var(--accent)" : "transparent"};border-color:${active ? "var(--accent)" : "var(--border)"};color:${active ? "var(--accent-contrast)" : "var(--text)"}">${d.label}</button>`;
  }).join("");

  const filterChips = FILTER_DEFS.map(d => {
    const active = state.selFilters.includes(d.id);
    const fc = filterColor(d.id, t);
    return `<button type="button" class="chip-filter" data-action="toggle-filter" data-id="${d.id}"
      style="background:${active ? softAlpha(fc, t) : "transparent"};border-color:${active ? fc : "var(--border)"};color:${active ? fc : "var(--text-secondary)"}">${d.label}</button>`;
  }).join("");

  const catLabels = CAT_DEFS.filter(d => state.selCats.includes(d.id)).map(d => d.label);
  const timeDef = TIME_DEFS.find(d => d.id === state.selTime);
  const filterLabels = FILTER_DEFS.filter(d => state.selFilters.includes(d.id)).map(d => d.label);
  let summaryText;
  if (catLabels.length === 0) summaryText = "Wähle zuerst eine Kategorie aus.";
  else if (!timeDef) summaryText = catLabels.join(", ") + " · noch keine Zeitangabe.";
  else summaryText = catLabels.join(", ") + " · " + timeDef.label + " · " + state.days + " Tage für " + state.persons + " Personen → " + (state.days * state.persons) + " Portionen" + (filterLabels.length ? " · " + filterLabels.join(", ") : "");

  const ctaDisabled = catLabels.length === 0 || !timeDef;

  viewForm.innerHTML = `
    <div class="form-progress">
      <div class="form-progress-track"><div class="form-progress-fill" style="width:${pct}%"></div></div>
      <div class="form-progress-label">${filled} von 4 Angaben</div>
    </div>
    <div class="form-grid">
      <div class="summary-card">
        <h4>Deine Auswahl</h4>
        <p>${summaryText}</p>
      </div>
      <div class="form-card">
        <h2>Was wird gekocht?</h2>
        <div class="lede">Vier kurze Angaben – dann bekommst du passende Rezepte für dein Meal Prep.</div>
        <div class="field-group">
          <div>
            <div class="field-label-row"><div class="field-num">1</div><div class="label">Worauf hast du Lust?</div><div class="hint">(Mehrfachauswahl)</div></div>
            <div class="chip-row">${catChips}</div>
          </div>
          <div>
            <div class="field-label-row"><div class="field-num">2</div><div class="label">Zeit pro Kochsession?</div></div>
            <div class="chip-row">${timeChips}</div>
          </div>
          <div class="stepper-row">
            <div>
              <div class="field-label-row"><div class="field-num">3</div><div class="label">Für wie viele Tage?</div></div>
              <div class="stepper">
                <button type="button" data-action="adjust-days" data-delta="-1" ${state.days <= 1 ? "disabled" : ""} style="opacity:${state.days <= 1 ? 0.4 : 1}">−</button>
                <span class="val">${state.days}</span>
                <button type="button" data-action="adjust-days" data-delta="1" ${state.days >= 14 ? "disabled" : ""} style="opacity:${state.days >= 14 ? 0.4 : 1}">+</button>
                <span class="unit">Tage</span>
              </div>
            </div>
            <div>
              <div class="field-label-row"><div class="field-num">4</div><div class="label">Für wie viele Personen?</div></div>
              <div class="stepper">
                <button type="button" data-action="adjust-persons" data-delta="-1" ${state.persons <= 1 ? "disabled" : ""} style="opacity:${state.persons <= 1 ? 0.4 : 1}">−</button>
                <span class="val">${state.persons}</span>
                <button type="button" data-action="adjust-persons" data-delta="1" ${state.persons >= 8 ? "disabled" : ""} style="opacity:${state.persons >= 8 ? 0.4 : 1}">+</button>
                <span class="unit">Personen</span>
              </div>
            </div>
          </div>
          <div>
            <div class="field-label-row"><div class="field-num optional">5</div><div class="label">Noch etwas Bestimmtes?</div><div class="hint">(optional)</div></div>
            <div class="chip-row">${filterChips}</div>
          </div>
        </div>
        <div class="form-footer">
          <div class="hint">${ctaDisabled ? "Kategorie und Zeit sind Pflichtangaben." : "Bereit für deine Vorschläge."}</div>
          <button type="button" class="btn-cta" data-action="go-results" ${ctaDisabled ? "disabled" : ""}
            style="background:${ctaDisabled ? "var(--surface-muted)" : "var(--accent)"};color:${ctaDisabled ? "var(--text-tertiary)" : "var(--accent-contrast)"};opacity:${ctaDisabled ? 0.7 : 1};box-shadow:${ctaDisabled ? "none" : "0 8px 20px -8px var(--accent-soft)"}">Rezepte finden →</button>
        </div>
      </div>
    </div>
  `;
}

function renderResultsView(){
  const t = state.theme;
  const plannedList = getPlannedList();
  const totalPortions = plannedList.reduce((a, { batches }) => a + batches * state.persons, 0);
  const portionsNeeded = state.days * state.persons;
  const portionsPct = portionsNeeded ? Math.min(100, Math.round((totalPortions / portionsNeeded) * 100)) : 0;
  const catLabels = CAT_DEFS.filter(d => state.selCats.includes(d.id)).map(d => d.label);
  const comboText = catLabels.join(", ") + " · " + state.days + " Tage · " + state.persons + " Personen";

  const cards = state.resultIds.map(id => {
    const r = RECIPES.find(x => x.id === id);
    if (!r) return "";
    const cd = CAT_MAP[r.category];
    const cc = catColor(r.category, t);
    const expanded = !!state.expanded[id];
    const batches = state.plan[id] || 0;
    const tagsHtml = r.tags.map(tag => {
      const fd = FILTER_MAP[tag]; const fc = filterColor(tag, t);
      return `<span class="tag-badge" style="background:${softAlpha(fc, t)};color:${fc}">${fd.label}</span>`;
    }).join("");
    const detailHtml = expanded ? `
      <div class="recipe-detail">
        <h5>Zutaten · ${state.persons} Personen</h5>
        <ul>${r.ingredients.map(ing => `<li>${fmtAmount(ing.amount * state.persons)} ${ing.unit} ${ing.name}</li>`).join("")}</ul>
        <h5>Zubereitung</h5>
        <ol>${r.steps.map(s => `<li>${s}</li>`).join("")}</ol>
      </div>` : "";
    return `
      <div class="recipe-card">
        <div class="recipe-card-top">
          <div class="recipe-cat" style="color:${cc}">${cd.label}</div>
          <div class="recipe-time">${r.time} Min</div>
        </div>
        <div class="recipe-title">${r.title}</div>
        <div class="recipe-tags">${tagsHtml}</div>
        <button type="button" class="expand-btn" data-action="toggle-expand" data-id="${id}">${expanded ? "Zutaten & Zubereitung ausblenden" : "Zutaten & Zubereitung anzeigen"}</button>
        ${detailHtml}
        <div style="flex:1"></div>
        <div class="recipe-foot">
          <div class="freezer-note">${SNOWFLAKE_SVG}${r.freezer ? "Einfrierbar" : "Frisch genießen"}</div>
          <div class="batch-ctl">
            <button type="button" class="minus" data-action="adjust-plan" data-id="${id}" data-delta="-1" ${batches <= 0 ? "disabled" : ""} style="opacity:${batches <= 0 ? 0.4 : 1}">−</button>
            <span class="batch-count">${batches}</span>
            <button type="button" class="plus" data-action="adjust-plan" data-id="${id}" data-delta="1">+</button>
          </div>
        </div>
      </div>`;
  }).join("");

  const hasResults = state.resultIds.length > 0;

  viewResults.innerHTML = `
    <button type="button" class="back-link" data-action="go-form">← Angaben ändern</button>
    <div class="results-head">
      <div>
        <h2 class="view-title">Deine Vorschläge</h2>
        <div class="combo-text">${comboText}</div>
        <div class="portions-line"><b>${totalPortions}</b> von ${portionsNeeded} Portionen geplant</div>
        <div class="portions-track"><div class="portions-fill" style="width:${portionsPct}%"></div></div>
      </div>
      <button type="button" class="btn-ghost" data-action="shuffle">${SHUFFLE_SVG}Andere Vorschläge</button>
    </div>
    ${hasResults ? `<div class="recipe-grid">${cards}</div>` : `
      <div class="empty-state">
        <h3>Keine Treffer</h3>
        <p>Mit dieser Kombination ist die Rezeptbox gerade leer. Versuch's mit weniger Filtern.</p>
      </div>`}
  `;
}

function renderShoppingView(){
  const t = state.theme;
  const plannedList = getPlannedList();
  const totalPortions = plannedList.reduce((a, { batches }) => a + batches * state.persons, 0);
  const hasPlan = plannedList.length > 0;
  const ing = buildAggregate();

  const ingredientsHtml = ing.map(it => `
    <div class="shopping-item"><span>${it.name}</span><span class="amt">${fmtAmount(it.total)} ${it.unit}</span></div>
  `).join("");

  const recipesHtml = plannedList.map(({ recipe, batches }) => {
    const cc = catColor(recipe.category, t);
    return `<div class="shopping-recipe-item">
      <span class="dot" style="background:${cc}"></span>
      <span style="flex:1">${recipe.title}</span>
      <span class="batch-pill" style="background:${softAlpha(cc, t)};color:${cc}">${batches}×</span>
    </div>`;
  }).join("");

  viewShopping.innerHTML = `
    <button type="button" class="back-link" data-action="go-back-sub">← Zurück</button>
    <h2 class="view-title">Einkaufsliste</h2>
    <div class="sub-subtitle">${hasPlan ? plannedList.length + " Gerichte · " + totalPortions + " Portionen geplant" : "Noch keine Gerichte geplant."}</div>
    ${hasPlan ? `
      <div class="shopping-grid">
        <div class="shopping-panel"><h5>Zutaten</h5><div>${ingredientsHtml}</div></div>
        <div class="shopping-panel"><h5>Geplante Gerichte</h5><div>${recipesHtml}</div></div>
      </div>
      <div class="shopping-actions">
        <button type="button" class="btn-accent" data-action="export-reminders">Als Erinnerungen exportieren</button>
        <button type="button" class="btn-outline" data-action="copy-list">Liste kopieren</button>
        <button type="button" class="btn-outline muted" data-action="clear-plan">Wochenplan leeren</button>
      </div>
    ` : `
      <div class="empty-state">
        <h3>Noch nichts geplant</h3>
        <p>Füg über „+" an einer Rezeptkarte Portionen zum Wochenplan hinzu.</p>
      </div>
    `}
  `;
}

function renderCooklistView(){
  const t = state.theme;
  const plannedList = getPlannedList();
  const hasPlan = plannedList.length > 0;

  const itemsHtml = plannedList.map(({ recipe, batches }) => {
    const cd = CAT_MAP[recipe.category];
    const cc = catColor(recipe.category, t);
    const ingredientsHtml = recipe.ingredients.map(ing => `<li>${fmtAmount(ing.amount * state.persons * batches)} ${ing.unit} ${ing.name}</li>`).join("");
    const stepsHtml = recipe.steps.map((text, idx) => {
      const key = recipe.id + ":" + idx;
      const checked = !!state.checkedSteps[key];
      return `<label class="cooklist-step${checked ? " checked" : ""}">
        <input type="checkbox" data-action="toggle-step" data-key="${key}" ${checked ? "checked" : ""}>
        <span>${text}</span>
      </label>`;
    }).join("");
    return `
      <div class="cooklist-item" style="border-top-color:${cc}">
        <div class="cooklist-item-head">
          <div>
            <div class="cat" style="color:${cc}">${cd.label}</div>
            <h3>${recipe.title}</h3>
          </div>
          <div class="cooklist-batches" style="color:${cc};background:${softAlpha(cc, t)}">${batches}× zubereiten</div>
        </div>
        <div class="cooklist-cols">
          <div><h5>Zutaten</h5><ul>${ingredientsHtml}</ul></div>
          <div><h5>Zubereitung</h5><div class="cooklist-steps">${stepsHtml}</div></div>
        </div>
      </div>`;
  }).join("");

  viewCooklist.innerHTML = `
    <button type="button" class="back-link" data-action="go-back-sub">← Zurück</button>
    <h2 class="view-title">Kochliste</h2>
    <div class="sub-subtitle" style="max-width:60ch">Bleibt gespeichert, bis du „Wochenplan leeren" antippst – auch nach dem Einkaufen, bis du tatsächlich kochst.</div>
    ${hasPlan ? `<div class="cooklist-list">${itemsHtml}</div>` : `
      <div class="empty-state">
        <h3>Noch keine Kochliste</h3>
        <p>Plane zuerst Gerichte auf dem Ergebnis-Screen ein.</p>
      </div>`}
  `;
}

function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  themeColorMeta.setAttribute("content", state.theme === "dark" ? "#10131A" : "#F7F5EF");
  renderHeader();
  viewForm.classList.toggle("active", state.view === "form");
  viewResults.classList.toggle("active", state.view === "results");
  viewShopping.classList.toggle("active", state.view === "shopping");
  viewCooklist.classList.toggle("active", state.view === "cooklist");
  if (state.view === "form") renderForm();
  else if (state.view === "results") renderResultsView();
  else if (state.view === "shopping") renderShoppingView();
  else if (state.view === "cooklist") renderCooklistView();
}

// ---------------- EVENT DELEGATION ----------------
document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const delta = el.dataset.delta !== undefined ? parseInt(el.dataset.delta, 10) : undefined;
  switch (action) {
    case "toggle-theme": toggleTheme(); break;
    case "toggle-cat": toggleCat(id); break;
    case "select-time": selectTime(id); break;
    case "toggle-filter": toggleFilter(id); break;
    case "adjust-days": adjustDays(delta); break;
    case "adjust-persons": adjustPersons(delta); break;
    case "toggle-expand": toggleExpand(id); break;
    case "go-form": goForm(); break;
    case "go-results": goResults(); break;
    case "shuffle": shuffle(); break;
    case "go-shopping": goShopping(); break;
    case "go-cooklist": goCooklist(); break;
    case "go-back-sub": goBackFromSub(); break;
    case "adjust-plan": adjustPlan(id, delta); break;
    case "export-reminders": exportReminders(); break;
    case "copy-list": copyList(); break;
    case "clear-plan": clearPlan(); break;
  }
});
document.body.addEventListener("change", (e) => {
  const el = e.target.closest('[data-action="toggle-step"]');
  if (!el) return;
  toggleStep(el.dataset.key);
});

loadPersisted();
render();
</script>
